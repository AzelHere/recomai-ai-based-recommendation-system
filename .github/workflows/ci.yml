name: Recom AI verification
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sh mvnw -B -f backend/pom.xml clean verify
      - run: sh mvnw -B -f backend/pom.xml com.github.spotbugs:spotbugs-maven-plugin:4.10.5.0:spotbugs
      - run: python3 scripts/check-publication.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Create isolated local credentials
        shell: bash
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "COMPOSE_PROFILES=local-mail" >> .env
      - run: npm run test:e2e -- --workers=1
      - run: npm run test:e2e -- --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-browser-diagnostics
          path: |
            backend/target/site/jacoco/
            backend/target/spotbugsXml.xml
            test-results/
