name: Recom AI verification
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh mvnw -B -f backend/pom.xml clean verify
      - run: sh mvnw -B -f backend/pom.xml com.github.spotbugs:spotbugs-maven-plugin:4.10.5.0:spotbugs
      - run: python3 scripts/check-static-analysis.py
      - run: python3 scripts/check-publication.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-coverage-and-static-analysis
          path: |
            backend/target/site/jacoco/
            backend/target/spotbugsXml.xml
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Create isolated local credentials
        shell: bash
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "COMPOSE_PROFILES=local-mail" >> .env
      - run: docker build -t recomai-ci:local .
      - run: docker build -f Dockerfile.coverage --build-arg APP_IMAGE=recomai-ci:local -t recomai-ci-coverage:local .
      - run: npm run test:e2e -- --workers=${{ matrix.workers }}
        env:
          E2E_EXISTING_IMAGE: recomai-ci-coverage:local
          E2E_COVERAGE_DIR: target/ci-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diagnostics-${{ matrix.workers }}-workers
          path: |
            test-results/
            target/ci-coverage/
