spring.application.name=ai-based-recommendation-system
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_recommendation_system?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:recommendation_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

recommendation.mix.familiar=${RECOMMENDATION_FAMILIAR_SHARE:0.70}
recommendation.mix.related=${RECOMMENDATION_RELATED_SHARE:0.20}
recommendation.mix.discovery=${RECOMMENDATION_DISCOVERY_SHARE:0.10}
recommendation.signals.view=${SIGNAL_VIEW:0.15}
recommendation.signals.click=${SIGNAL_CLICK:0.50}
recommendation.signals.read-progress=${SIGNAL_READ_PROGRESS:0.65}
recommendation.signals.save=${SIGNAL_SAVE:1.00}
recommendation.signals.purchase=${SIGNAL_PURCHASE:1.25}
recommendation.signals.like=${SIGNAL_LIKE:1.00}
recommendation.signals.dislike=${SIGNAL_DISLIKE:-1.25}
recommendation.signals.hide=${SIGNAL_HIDE:-1.50}
recommendation.signals.share=${SIGNAL_SHARE:1.50}
recommendation.signals.skip=${SIGNAL_SKIP:-0.25}
recommendation.signals.more-like=${SIGNAL_MORE_LIKE:1.25}
recommendation.signals.search=${SIGNAL_SEARCH:0.12}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.password-reset.account-cooldown-seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}
app.mail.from=${SMTP_FROM:no-reply@localhost}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
logging.pattern.level=%5p [${spring.application.name:recomai},%X{requestId:-}]
