services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: [local-mail]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_recommendation_system}
      MYSQL_USER: ${DB_USERNAME:-recommendation_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or run start-local.ps1}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env or run start-local.ps1}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ai_recommendation_system}?serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-recommendation_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or run start-local.ps1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:${APP_HOST_PORT:-8080}}
      PASSWORD_RESET_COOLDOWN_SECONDS: ${PASSWORD_RESET_COOLDOWN_SECONDS:-60}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-no-reply@recomai.local}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      RECOMMENDATION_FAMILIAR_SHARE: ${RECOMMENDATION_FAMILIAR_SHARE:-0.70}
      RECOMMENDATION_RELATED_SHARE: ${RECOMMENDATION_RELATED_SHARE:-0.20}
      RECOMMENDATION_DISCOVERY_SHARE: ${RECOMMENDATION_DISCOVERY_SHARE:-0.10}
      SIGNAL_VIEW: ${SIGNAL_VIEW:-0.15}
      SIGNAL_CLICK: ${SIGNAL_CLICK:-0.50}
      SIGNAL_READ_PROGRESS: ${SIGNAL_READ_PROGRESS:-0.65}
      SIGNAL_SAVE: ${SIGNAL_SAVE:-1.00}
      SIGNAL_PURCHASE: ${SIGNAL_PURCHASE:-1.25}
      SIGNAL_LIKE: ${SIGNAL_LIKE:-1.00}
      SIGNAL_DISLIKE: ${SIGNAL_DISLIKE:--1.25}
      SIGNAL_HIDE: ${SIGNAL_HIDE:--1.50}
      SIGNAL_SHARE: ${SIGNAL_SHARE:-1.50}
      SIGNAL_SKIP: ${SIGNAL_SKIP:--0.25}
      SIGNAL_MORE_LIKE: ${SIGNAL_MORE_LIKE:-1.25}
      SIGNAL_SEARCH: ${SIGNAL_SEARCH:-0.12}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  mysql_data:
