# Activate explicitly only behind a trusted HTTPS reverse proxy. No deployment is performed here.
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.devtools.restart.enabled=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
app.public-url=${PRODUCTION_PUBLIC_URL}
spring.mail.host=${PRODUCTION_SMTP_HOST}
spring.mail.port=${PRODUCTION_SMTP_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
